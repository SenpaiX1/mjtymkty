<!DOCTYPE html>
<html lang="en-us">

<head>
     <base href="https://cdn.jsdelivr.net/gh/SenpaiX1/y34@latest/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | NIMRODS</title>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #FFFFFF"></canvas>
  <script src="Build/webgl-release.loader.js"></script>
  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.position = "fixed";

      document.body.style.textAlign = "left";
    }

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "https://dl.dropboxusercontent.com/scl/fi/vvfnlvlig36rts1im5du8/webgl-release.data.gz?rlkey=iqefiadlgteg2g5f6s0fn4g0g&st=1fqtm5zd&dl=0",
      frameworkUrl: "https://dl.dropboxusercontent.com/scl/fi/t5n9ut37f1ajwxtbs4774/webgl-release.framework.js?rlkey=3owfieq47ga6tt5j4b4tnazjn&st=ws22stkw&dl=0",
      codeUrl: "https://dl.dropboxusercontent.com/scl/fi/d9pmh340t2yjy7glgi1eg/webgl-release.wasm.gz?rlkey=dsahk9tc8qz0bpgabibv2yoeq&st=cjqrercr&dl=0",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Fiveamp",
      productName: "NIMRODS",
      productVersion: "0.2.7",
      // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
      // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
    });
  </script>
</body>

</html>
